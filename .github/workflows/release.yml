name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DATABASE_URL: file:./database.sqlite3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Set version from tag
        run: npm pkg set version=${GITHUB_REF#refs/tags/v}
        shell: bash

      - run: echo 'DATABASE_URL=file:./database.sqlite3' > .env

      - name: Build and package
        run: |
          npx nx run-many -t build --projects=renderer,desktop --configuration=production
          npx nx run desktop:make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            dist/executables/*.zip
            dist/executables/*.exe
            dist/executables/*.yml
            dist/executables/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-build"
          merge-multiple: true
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/dist/executables/*.zip
            release-artifacts/dist/executables/*.exe
            release-artifacts/dist/executables/*.yml
            release-artifacts/dist/executables/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
